# CLI commands shown in the drawer on the Workflows overview page.
# Constraint: self-hosted only, never a `-k` / `--kubernetes` command.
# Scheduler management lives on the Control Plane page.
context: Workflows
tools:
  dapr:
    label: Dapr
    commands:
      - title: List workflows for this app
        command: dapr workflow list --app-id {{appId}}
        docs: https://docs.dapr.io/reference/cli/dapr-workflow/
      - title: List running workflows
        command: dapr workflow list --app-id {{appId}} --filter-status RUNNING
        docs: https://docs.dapr.io/reference/cli/dapr-workflow/
      - title: List instances of a named workflow
        command: dapr workflow list --app-id {{appId}} --filter-name <workflow-name>
        docs: https://docs.dapr.io/reference/cli/dapr-workflow/
      - title: Start a new workflow instance
        command: dapr workflow run <workflow-name> --app-id {{appId}} --input '{"key":"value"}'
        docs: https://docs.dapr.io/reference/cli/dapr-workflow/
