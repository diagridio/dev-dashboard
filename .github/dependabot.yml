version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /test/e2e/wfapp
      - /test/e2e/fixtures/testcontainers
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /
      - /test/e2e/fixtures/compose
    schedule:
      interval: weekly
