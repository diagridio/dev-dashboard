version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /test/e2e/wfapp
      - /test/e2e/fixtures/testcontainers
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # 0.x "minor" bumps are breaking and must track the dapr/dapr release
      # line (v0.15 needs dapr/dapr v1.19); move it with a Dapr upgrade.
      - dependency-name: github.com/dapr/durabletask-go
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /
      - /test/e2e/fixtures/compose
    schedule:
      interval: weekly
