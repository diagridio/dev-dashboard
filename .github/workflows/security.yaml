name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories surface even when nothing is merged.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26.10' }
      - run: .github/scripts/govulncheck.sh
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24' }
      # Production deps only: they are what gets compiled into the embedded
      # SPA. Dev-tooling advisories (vite, vitest) arrive via Dependabot.
      - run: cd web && npm audit --omit=dev --audit-level=high
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26.10', cache: false }
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: pipx run zizmor==1.31.1 --min-severity=medium .github/workflows
