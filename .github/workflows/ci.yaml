name: ci
on:
  push:
    branches: [main]
  # No path filters: go/web/docker are required checks on main, and a
  # filtered-out run would leave docs-only PRs waiting on them forever.
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.7' }
      - run: go install gotest.tools/gotestsum@latest
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags unit ./...
      - run: gotestsum --format testname -- -tags unit -race ./...
      - run: gotestsum --format testname -- -tags integration -race ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: cd web && npm install && npm run lint && npm run build && npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image (no push)
        run: docker build -t dev-dashboard:ci .
