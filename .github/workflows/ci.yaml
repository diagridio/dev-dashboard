name: ci
on:
  push:
    branches: [main]
  # No path filters: go/web/docker are required checks on main, and a
  # filtered-out run would leave docs-only PRs waiting on them forever.
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26.10' }
      - run: go install gotest.tools/gotestsum@v1.13.0
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags unit ./...
      - run: gotestsum --format testname -- -tags unit -race ./...
      - run: gotestsum --format testname -- -tags integration -race ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24' }
      - run: cd web && npm ci && npm run lint && npm run build && npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build container image (no push)
        run: docker build -t dev-dashboard:ci .
