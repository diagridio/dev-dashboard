apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: diagnostics
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: http://localhost:9411/api/v2/spans
  features:
    # HotReload is a valid Dapr 1.19 flag and already on by default, so this
    # only makes the Features section show up without changing behaviour.
    - name: HotReload
      enabled: true
