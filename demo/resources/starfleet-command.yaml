apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: starfleet-command
spec:
  baseUrl: http://localhost:6003/starfleet
  headers:
    - name: X-Starfleet-Api-Key
      # The secret name is the key in secrets.json; the store is auth.secretStore.
      secretKeyRef:
        name: starfleet-api-key
        key: starfleet-api-key
    - name: X-Ship
      value: Enterprise
auth:
  secretStore: command-codes
