apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: command-codes
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    # Relative to each app directory (demo/<app>/), where daprd runs under `dapr run -f`.
    - name: secretsFile
      value: ../secrets.json
    - name: nestedSeparator
      value: ":"
